<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Entrar | Engenharia de Software</title>
  <link rel="stylesheet" href="/login.css">

</head>
<body>
  <div id="loading" class="loading-screen" role="status">Consultando sua sessão...</div>

      <div class="brand"><strong>ES<span>/</span></strong><span>Engenharia de Software<small>Panorama em números</small></span></div>

        <h1 id="login-title">Acesse o painel</h1>

        <p id="login-status" class="login-status" role="status">Escolha como deseja entrar.</p>
        <div class="login-actions">

            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.8 3-4.3 3-7.3Z"/><path fill="#34A853" d="M12 22c2.7 0 5-1 6.6-2.5l-3.2-2.5c-.9.6-2 .9-3.4.9-2.6 0-4.8-1.7-5.6-4H3.1v2.6A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 13.9a6 6 0 0 1 0-3.8V7.5H3.1a10 10 0 0 0 0 9l3.3-2.6Z"/><path fill="#EA4335" d="M12 6.1c1.5 0 2.8.5 3.8 1.5l2.8-2.8A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.9 5.5l3.3 2.6c.8-2.3 3-4 5.6-4Z"/></svg>
            Entrar com Google
          </a>
          <a class="provider-button" href="/oauth/login/github">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .8a11.2 11.2 0 0 0-3.54 21.82c.56.1.76-.24.76-.53v-1.86c-3.1.68-3.75-1.31-3.75-1.31-.51-1.3-1.25-1.65-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.73 1.16 1.73 1.16 1.01 1.73 2.64 1.23 3.28.94.1-.73.39-1.23.71-1.51-2.48-.28-5.09-1.24-5.09-5.54 0-1.22.44-2.22 1.15-3.01-.11-.28-.5-1.42.11-2.96 0 0 .94-.3 3.08 1.15A10.7 10.7 0 0 1 12 6.3c.95 0 1.9.13 2.79.38 2.14-1.45 3.07-1.15 3.07-1.15.61 1.54.23 2.68.12 2.96.72.79 1.14 1.79 1.14 3.01 0 4.31-2.62 5.26-5.11 5.54.4.35.75 1.04.75 2.1v2.95c0 .29.2.64.77.53A11.2 11.2 0 0 0 12 .8Z"/></svg>
            Entrar com GitHub
          </a>

      </div>
    </section>

</html>
