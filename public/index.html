<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Laboratório de autenticação</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172036; background: #f5f7fc; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 10% 10%, #e8edff 0, transparent 35%), radial-gradient(circle at 90% 80%, #e4f4f1 0, transparent 33%), #f5f7fc; }
    .layout { min-height: 100vh; display: grid; place-items: center; padding: 32px 18px; }
    .card { width: min(100%, 440px); padding: 36px; background: #fff; border: 1px solid #e6eaf2; border-radius: 22px; box-shadow: 0 22px 60px rgba(25, 43, 78, .10); }
    .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; background: #eef1ff; color: #4755bd; font-size: 24px; font-weight: 700; }
    .eyebrow { margin: 24px 0 8px; color: #52619b; font-size: 12px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(25px, 5vw, 31px); letter-spacing: -.035em; line-height: 1.2; }
    .lede { margin: 12px 0 24px; color: #5d6880; line-height: 1.55; }
    .status { margin: 0 0 22px; padding: 12px 14px; border-radius: 10px; background: #f4f6fb; color: #42506a; font-size: 14px; }
    .actions { display: grid; gap: 12px; }
    .action { min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 12px 18px; border: 1px solid #d9dfea; border-radius: 11px; background: #fff; color: #202a40; font: inherit; font-weight: 650; text-decoration: none; cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
    .action:hover { border-color: #8694d0; background: #f8f9fe; transform: translateY(-1px); }
    .action:focus-visible { outline: 3px solid #818cf8; outline-offset: 3px; }
    .action svg { flex: none; width: 20px; height: 20px; }
    .account { padding: 18px; border: 1px solid #dce9e5; border-radius: 12px; background: #f5faf8; }
    .account-name { margin: 0 0 4px; font-size: 19px; font-weight: 700; overflow-wrap: anywhere; }
    .account-detail { margin: 4px 0; color: #58677a; font-size: 14px; overflow-wrap: anywhere; }
    .logout { margin: 18px 0 0; }
    .logout .action { background: #172036; border-color: #172036; color: #fff; }
    .logout .action:hover { background: #2d3b58; }
    .note { margin: 24px 0 0; color: #818ba0; font-size: 12px; line-height: 1.5; text-align: center; }
    @media (max-width: 480px) { .card { padding: 26px 22px; border-radius: 18px; } }
    @media (prefers-reduced-motion: reduce) { .action { transition: none; } }
  </style>
</head>
<body>
  <main class="layout">
    <section class="card" aria-labelledby="title">
      <div class="mark" aria-hidden="true">✓</div>
      <p class="eyebrow">Laboratório de autenticação</p>
      <h1 id="title">Entre na sua conta</h1>
      <p class="lede">Use sua conta Google ou GitHub para acessar sua sessão.</p>
      <p id="status" class="status" role="status" aria-live="polite">Consultando sua sessão...</p>

      <div id="login" class="actions" hidden>
        <a class="action" href="/oauth/login/google">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.8 3-4.3 3-7.3Z"/><path fill="#34A853" d="M12 22c2.7 0 5-1 6.6-2.5l-3.2-2.5c-.9.6-2 .9-3.4.9-2.6 0-4.8-1.7-5.6-4H3.1v2.6A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 13.9a6 6 0 0 1 0-3.8V7.5H3.1a10 10 0 0 0 0 9l3.3-2.6Z"/><path fill="#EA4335" d="M12 6.1c1.5 0 2.8.5 3.8 1.5l2.8-2.8A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.9 5.5l3.3 2.6c.8-2.3 3-4 5.6-4Z"/></svg>
          Entrar com Google
        </a>
        <a class="action" href="/oauth/login/github">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.18-3.37-1.18-.45-1.15-1.1-1.46-1.1-1.46-.9-.61.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.36 1.08 2.94.83.09-.65.35-1.08.64-1.33-2.22-.25-4.56-1.11-4.56-4.95 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.6 9.6 0 0 1 12 6.8c.85 0 1.7.12 2.5.34 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.85-2.34 4.7-4.57 4.95.36.31.68.92.68 1.85V21c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>
          Entrar com GitHub
        </a>
      </div>

      <div id="account" hidden>
        <div class="account">
          <p id="identity-name" class="account-name"></p>
          <p id="identity-email" class="account-detail" hidden></p>
          <p class="account-detail">Conectado com <span id="identity-provider"></span></p>
        </div>
        <form class="logout" action="/oauth/logout" method="post">
          <button class="action" type="submit">Sair da conta</button>
        </form>
      </div>
      <p class="note">Sua sessão permanece ativa até você sair ou ela expirar.</p>
    </section>
  </main>
  <script>
    async function session() {
      const status = document.getElementById('status');
      const login = document.getElementById('login');
      const account = document.getElementById('account');
      try {
        const response = await fetch('/api/me', { credentials: 'same-origin', cache: 'no-store' });
        const data = await response.json();
        if (response.ok && data.authenticated && data.user) {
          document.getElementById('identity-name').textContent = data.user.name || 'Usuário';
          const email = document.getElementById('identity-email');
          email.textContent = data.user.email || '';
          email.hidden = !data.user.email;
          document.getElementById('identity-provider').textContent = data.user.provider === 'google' ? 'Google' : 'GitHub';
          status.textContent = 'Você está autenticado.';
          account.hidden = false;
        } else if (response.status === 401) {
          status.textContent = 'Você não está autenticado.';
          login.hidden = false;
        } else {
          status.textContent = 'Não foi possível consultar sua sessão. Atualize a página para tentar novamente.';
          login.hidden = false;
        }
      } catch {
        status.textContent = 'Não foi possível consultar sua sessão. Atualize a página para tentar novamente.';
        login.hidden = false;
      }
    }
    session();
  </script>
</body>
</html>
