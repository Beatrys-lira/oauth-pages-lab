name: migrar
on:
  push:
    branches: [main]
    paths: ['migrations/**']
permissions:
  contents: read
concurrency:
  group: migracoes-d1
  cancel-in-progress: false
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Aplica migrações no D1
        run: npx --yes wrangler d1 migrations apply oauth-pages-bd --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Confirma estrutura da tabela notas
        run: npx --yes wrangler d1 execute oauth-pages-bd --remote --command "PRAGMA table_info(notas)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
