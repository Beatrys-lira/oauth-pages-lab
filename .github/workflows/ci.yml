name: ci
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Procura segredos versionados
        run: |
          if git grep -qE "GOCSPX-|client_secret *= *['\"][^'\"]+" -- . ':!*.md' ':!.github/workflows/ci.yml'; then
            echo "::error::Possível segredo no repositório"; exit 1
          fi
      - name: Aplica as migrações D1 em um SQLite local
        run: |
          command -v sqlite3 >/dev/null || (sudo apt-get update && sudo apt-get install -y sqlite3)
          for f in migrations/*.sql; do sqlite3 -bail teste.db < "$f"; done
          sqlite3 teste.db ".tables"
      - name: Valida HTML
        run: npx --yes htmlhint "**/*.html"

  testar-protecao:
    if: github.event_name == 'push' && github.ref == 'refs/heads/avaliacao-actions'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Confirma recusa de push direto na main
        run: |
          if git push origin HEAD:main > push.log 2>&1; then
            cat push.log
            echo "::error::O push direto não foi recusado."; exit 1
          fi
          cat push.log
          if ! grep -Eq 'GH006|GH013|protected branch|Changes must be made through a pull request|required status check' push.log; then
            echo "::error::A recusa não demonstrou proteção da main."; exit 1
          fi
